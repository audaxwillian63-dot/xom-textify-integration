<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" version="1.2" baseProfile="tiny">
  <defs>
    <linearGradient id="xg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E6FF"/>
      <stop offset="100%" stop-color="#0070D9"/>
    </linearGradient>
  </defs>
  <!-- Brand rounded container -->
  <rect width="512" height="512" rx="100" fill="#061A3A"/>
  
  <!-- Outer subtle brand border -->
  <rect x="2" y="2" width="508" height="508" rx="98" fill="none" stroke="#00E6FF" stroke-width="3" stroke-opacity="0.35"/>

  <!-- Main Wordmark: X-OM -->
  <g transform="translate(18, 142)">
    <!-- 'X' mark with electric gradient -->
    <path d="M 28 20 L 78 20 L 110 72 L 142 20 L 192 20 L 138 108 L 194 196 L 144 196 L 110 140 L 76 196 L 26 196 L 82 108 Z" fill="url(#xg)"/>
    
    <!-- Hyphen '-' -->
    <rect x="206" y="96" width="28" height="20" rx="5" fill="#00E6FF"/>
    
    <!-- Letter 'O' in crisp white -->
    <path d="M 314 20 C 364 20 398 56 398 108 C 398 160 364 196 314 196 C 264 196 230 160 230 108 C 230 56 264 20 314 20 Z M 314 56 C 286 56 268 78 268 108 C 268 138 286 160 314 160 C 342 160 360 138 360 108 C 360 78 342 56 314 56 Z" fill="#FFFFFF" transform="translate(26, 0)"/>
    
    <!-- Letter 'M' in crisp white -->
    <path d="M 390 20 L 428 20 L 454 114 L 480 20 L 518 20 L 518 196 L 482 196 L 482 82 L 460 168 L 448 168 L 426 82 L 426 196 L 390 196 Z" fill="#FFFFFF" transform="translate(20, 0)"/>
  </g>

  <!-- Tagline: THE SMARTER WAY HOME -->
  <text x="256" y="388" fill="#C0C4CC" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" letter-spacing="5" text-anchor="middle">THE SMARTER WAY HOME</text>
  
  <!-- Subtle cyan accent bar -->
  <rect x="186" y="414" width="140" height="4" rx="2" fill="#00E6FF"/>
</svg>
